name: publish

# Publishes to PyPI via Trusted Publishing (OIDC): no API token is stored in
# the repo or on a developer machine. PyPI trusts exactly this repository +
# workflow file (publish.yml) + environment (pypi) — keep those names in sync
# with the trusted publisher configured on pypi.org.
on:
  push:
    tags: ["v*"]
  # Publish an already-pushed tag (e.g. one tagged before this workflow
  # existed): Actions → publish → Run workflow → tag = v0.21.0.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.21.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check the tag matches the pyproject version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-run-site/
    permissions:
      # Required for the OIDC token exchange with PyPI.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
